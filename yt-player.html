<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YouTube player page</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#ddd;font-family:system-ui,sans-serif;overflow:hidden}
#p{position:absolute;inset:0}
#msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:16px;font-size:14px}
</style>
</head>
<body>
<div id="p"></div>
<div id="msg"></div>
<script>
// Host this page on any https site (GitHub Pages, Netlify...). The organizer app opens it in a frame
// and controls it with messages: play, stop, volume. YouTube accepts it because it has a real https address.
(function(){
  var q=new URLSearchParams(location.search);
  var id=q.get("v")||"";
  var vol=Math.max(0,Math.min(100,Number(q.get("vol")||50)));
  var player=null,ready=false,pending=null,ID=/^[\w-]{6,15}$/;
  function send(m){m.vonyt=1;try{parent.postMessage(m,"*")}catch(e){}}
  function show(t){var m=document.getElementById("msg");m.textContent=t;m.style.display="flex"}
  function create(v){
    if(!ID.test(v)){show("No valid YouTube video id.");send({type:"error",code:2});return}
    if(player){try{player.loadVideoById(v)}catch(e){}return}
    window.onYouTubeIframeAPIReady=function(){
      player=new YT.Player("p",{width:"100%",height:"100%",videoId:v,
        playerVars:{autoplay:1,controls:1,playsinline:1,loop:1,playlist:v,rel:0,modestbranding:1,origin:location.origin},
        events:{
          onReady:function(){ready=true;try{player.setVolume(vol)}catch(e){}send({type:"ready"});if(pending){run(pending);pending=null}},
          onStateChange:function(e){
            send({type:"state",playing:e.data===1||e.data===3,code:e.data});
            if(e.data===0){try{player.seekTo(0);player.playVideo()}catch(x){}}
          },
          onAutoplayBlocked:function(){send({type:"blocked"})},
          onError:function(e){show("YouTube error "+e.data);send({type:"error",code:e.data})}
        }});
    };
    var s=document.createElement("script");
    s.src="https://www.youtube.com/iframe_api";
    s.onerror=function(){show("Couldn't reach YouTube. Check your internet.");send({type:"error",code:-1})};
    document.head.appendChild(s);
  }
  function run(m){
    if(!ready){pending=m;return}
    try{
      if(m.type==="play")player.playVideo();
      else if(m.type==="stop")player.stopVideo();
      else if(m.type==="volume"){vol=Number(m.value)||0;player.setVolume(vol)}
    }catch(e){}
  }
  window.addEventListener("message",function(e){
    var d=e.data;if(!d||d.vonyt!==1)return;
    if(d.type==="load")create(String(d.id||""));else run(d);
  });
  if(id)create(id);else send({type:"ready"});
})();
</script>
</body>
</html>
